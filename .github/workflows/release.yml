name: Release Unity Package

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: |
          VERSION=$(node -p "require('./Assets/Redmatch 2 Custom Map SDK/package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^# " version " " {
              found = 1
              next
            }

            found && /^# / {
              exit
            }

            found {
              print
            }
          ' "Assets/Redmatch 2 Custom Map SDK/CHANGELOG.md" > release-notes.md

      - name: Create asset list
        run: |
          echo "Assets/Redmatch 2 Custom Map SDK.meta" > metaList
          find "Assets/Redmatch 2 Custom Map SDK" -name "*.meta" | sort >> metaList

      - name: Create Unity package
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: Redmatch 2 Custom Map SDK v${{ steps.version.outputs.value }}.unitypackage
          include-files: metaList

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            "Redmatch 2 Custom Map SDK v$VERSION.unitypackage" \
            --target "$GITHUB_SHA" \
            --title "Redmatch 2 Custom Map SDK v$VERSION" \
            --notes-file release-notes.md