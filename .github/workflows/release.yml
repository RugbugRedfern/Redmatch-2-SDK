name: Release Unity Package

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: |
          VERSION=$(node -p "require('./Assets/Redmatch 2 Custom Map SDK/package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v version="$VERSION" '
            index($0, "# " version " ") == 1 {
              found = 1
              next
            }

            found && /^# / {
              exit
            }

            found {
              print
            }
          ' "Assets/Redmatch 2 Custom Map SDK/CHANGELOG.md" > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Could not find changelog notes for version $VERSION."
            exit 1
          fi

      - name: Create Unity package asset lists
        run: |
          echo "Assets/Redmatch 2 Custom Map SDK.meta" > sdkMetaList
          find "Assets/Redmatch 2 Custom Map SDK" -name "*.meta" | sort >> sdkMetaList

          echo "Assets/Maps/Demo Map.meta" > demoMapMetaList
          find "Assets/Maps/Demo Map" -name "*.meta" | sort >> demoMapMetaList

      - name: Create SDK Unity package
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: "Redmatch 2 Custom Map SDK v${{ steps.version.outputs.value }}.unitypackage"
          include-files: sdkMetaList

      - name: Create Demo Map Unity package
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: "Demo Map v${{ steps.version.outputs.value }}.unitypackage"
          include-files: demoMapMetaList

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            "Redmatch 2 Custom Map SDK v$VERSION.unitypackage#Redmatch 2 Custom Map SDK v$VERSION.unitypackage" \
            "Demo Map v$VERSION.unitypackage#Demo Map v$VERSION.unitypackage" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
